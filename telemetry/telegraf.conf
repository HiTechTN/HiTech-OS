# HiTech-OS — pont Telegraf : Mosquitto (MQTT) -> InfluxDB (Phase 2)

[[inputs.mqtt_consumer]]
  servers = ["tcp://127.0.0.1:1883"]
  topics = ["hitechos/+/+/+"]
  data_format = "json"
  name_override = "hitechos_telemetry"

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "$INFLUX_TOKEN"
  organization = "HiTechTN"
  bucket = "hitechos"
