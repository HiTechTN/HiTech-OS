; HiTech-OS — firmware "Patient Zero" (ESP32)
; Prototypage rapide en Arduino framework via PlatformIO (Phase 3).
; Migration prévue vers ESP-IDF une fois le firmware stabilisé.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient        ; client MQTT
    adafruit/DHT sensor library   ; capteur DHT22
    adafruit/Adafruit GFX Library ; requis par Adafruit SSD1306
    adafruit/Adafruit SSD1306     ; OLED
