[package]
name = "vibe-os"
version = "0.8.0"
edition = "2021"

[dependencies]
bootloader = "0.9.23"
spin = "0.9.8"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
x86_64 = "0.14.2"
pic8259 = "0.10.1"
bitflags = "2.6"
volatile = "0.4"
bit_field = "0.10"
lock_api = "0.4"


[lib]
name = "vibe_os"
path = "src/lib.rs"

[[bin]]
name = "vibe-os"
path = "src/main.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[package.metadata.bootimage]
run-command = ["qemu-system-x86_64", "-drive", "format=raw,file={}", "-serial", "stdio"]