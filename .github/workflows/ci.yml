name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        crate: [ai-daemon, apps/hitech-shell, hitech-installer]
    defaults:
      run:
        working-directory: ${{ matrix.crate }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
      - name: Install Wayland build dependencies
        if: matrix.crate == 'apps/hitech-shell'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libseat-dev libinput-dev \
            libdrm-dev libgbm-dev libwayland-dev libxkbcommon-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --verbose

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: apps/genio
            requirements: |
              -r requirements-dev.txt
              -r genio_server/requirements.txt
          - component: apps/hitech-store
            requirements: |
              -r requirements.txt
              pytest
              httpx
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.component }}/requirements*.txt
      - name: Install dependencies
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          python -m pip install --upgrade pip
          printf '%s\n' "$REQUIREMENTS" > .ci-requirements.txt
          python -m pip install -r .ci-requirements.txt
          rm -f .ci-requirements.txt
      - name: Tests
        run: python -m pytest -q

  genio-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/genio/genio_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/genio/genio_web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check and build
        run: npm run build

  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap unit tests
        run: bash bootstrap/tests/test-bootstrap.sh
      - name: Bootstrap dry-run (orion)
        run: ./bootstrap/hitech-bootstrap.sh --profile orion --dry-run
      - name: Bootstrap dry-run (minimal)
        run: ./bootstrap/hitech-bootstrap.sh --profile minimal --dry-run
      - name: Bootstrap syntax
        run: |
          bash -n bootstrap/hitech-bootstrap.sh
          python3 -m py_compile os/calamares-main.patch.py

  nix-flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: ${{ runner.os }}-nix-flake-${{ hashFiles('flake.lock', '**/Cargo.lock', 'apps/genio/genio_web/package-lock.json') }}
          restore-prefixes-first-match: ${{ runner.os }}-nix-flake-
          gc-max-store-size-linux: 5G
      - name: Verify offline installer source contract
        run: |
          set -euo pipefail
          grep -Fq 'environment.etc."hitech-os-source".source = self;' os/iso.nix
          grep -Fq 'environment.etc."hitech-os-source".source = self;' os/netinstaller.nix
          grep -Fq 'DEFAULT_REPO_URL' hitech-installer/src/main.rs
          grep -Fq 'verify_target_profile' hitech-installer/src/main.rs
      - name: Evaluate and test the flake
        run: nix flake check --extra-experimental-features "nix-command flakes"

  os-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: ${{ runner.os }}-nix-os-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: ${{ runner.os }}-nix-os-
          gc-max-store-size-linux: 5G
      - name: Build patient-zero (QEMU variant)
        run: nix build .#nixosConfigurations.patient-zero.config.system.build.toplevel -L --extra-experimental-features "nix-command flakes"
      - name: Closure size
        run: du -sh result

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install platformio
      - name: Build secrets (placeholders, never real credentials)
        working-directory: firmware/patient-zero/src
        run: cp secrets.h.example secrets.h
      - name: Build ESP32 firmware
        working-directory: firmware/patient-zero
        run: pio run

  iso-build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: live
            attr: nixosConfigurations.iso.config.system.build.isoImage
            artifact: hitechos-live-iso
            release_tag: live-iso
            title: "HiTech-OS — Live ISO (latest main build)"
          - target: netinstaller
            attr: nixosConfigurations.netinstaller.config.system.build.isoImage
            artifact: hitechos-netinstaller-iso
            release_tag: netinstaller-iso
            title: "HiTech-OS — NetInstaller ISO (latest main build)"
    concurrency:
      group: iso-${{ matrix.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: ${{ runner.os }}-nix-${{ matrix.target }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: ${{ runner.os }}-nix-${{ matrix.target }}-
          gc-max-store-size-linux: 10G
      - name: Build ${{ matrix.target }} ISO
        run: nix build ".#${{ matrix.attr }}" -L --extra-experimental-features "nix-command flakes"
      - name: Copy ISO out of the Nix store
        run: |
          set -euo pipefail
          mkdir -p dist
          ISO_PATH=$(find result/iso -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$ISO_PATH"
          cp --dereference "$ISO_PATH" dist/
      - name: Generate SHA-256 checksum
        run: |
          set -euo pipefail
          ISO_PATH=$(find dist -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$ISO_PATH"
          ISO_NAME=$(basename "$ISO_PATH")
          (cd dist && sha256sum "$ISO_NAME" > "$ISO_NAME.sha256")
      - name: Split ISO for GitHub release limits
        run: |
          set -euo pipefail
          ISO_PATH=$(find dist -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$ISO_PATH"
          split --bytes=1900M --numeric-suffixes=0 --suffix-length=2 \
            "$ISO_PATH" "$ISO_PATH.part-"
      - name: Upload boot media artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.iso
            dist/*.iso.sha256
            dist/*.iso.part-*
          retention-days: 30
      - name: Publish or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ISO_PATH=$(find dist -maxdepth 1 -type f -name '*.iso' -print -quit)
          SHA_PATH="$ISO_PATH.sha256"
          mapfile -t PARTS < <(find dist -maxdepth 1 -type f -name '*.iso.part-*' | sort)
          test -f "$ISO_PATH"
          test -f "$SHA_PATH"
          test "${#PARTS[@]}" -ge 1
          ISO_NAME=$(basename "$ISO_PATH")
          ISO_SIZE=$(stat -c%s "$ISO_PATH")
          gh release delete "${{ matrix.release_tag }}" --yes --cleanup-tag || true
          gh release create "${{ matrix.release_tag }}" "${PARTS[@]}" "$SHA_PATH" \
            --target "$GITHUB_SHA" \
            --title "${{ matrix.title }}" \
            --notes "Built from commit \`$GITHUB_SHA\` ($((ISO_SIZE / 1000 / 1000)) MB). Download every \`.part-XX\` file in lexical order, reconstruct with \`cat ${ISO_NAME}.part-* > ${ISO_NAME}\`, and verify with \`sha256sum --check ${ISO_NAME}.sha256\` before flashing." \
            --prerelease
