name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ai-daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build ai-daemon
        working-directory: ai-daemon
        run: cargo build --verbose
      - name: Lint (clippy)
        working-directory: ai-daemon
        run: cargo clippy -- -D warnings

  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - run: nix flake check

  os-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Build nixosConfigurations.patient-zero (variante QEMU)
        run: nix build .#nixosConfigurations.patient-zero.config.system.build.toplevel -L
      - name: Taille de la closure (indicateur d'empreinte)
        run: du -sh result

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install platformio
      - name: Secrets de build (placeholders — jamais les vrais identifiants)
        working-directory: firmware/patient-zero/src
        run: cp secrets.h.example secrets.h
      - name: Build firmware ESP32
        working-directory: firmware/patient-zero
        run: pio run

  iso-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # requis pour publier/mettre à jour la Release ci-dessous
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Build de l'ISO live HiTech-OS
        run: nix build .#nixosConfigurations.iso.config.system.build.isoImage -L
      - name: Taille de l'ISO générée
        run: du -sh result/iso/*
      - name: Publier l'ISO comme artefact du run (temporaire, 14 jours)
        uses: actions/upload-artifact@v4
        with:
          name: hitechos-live-iso
          path: result/iso/*.iso
          retention-days: 14
      - name: Publier/mettre à jour la Release "live-iso" (permanente, écrasée à chaque push sur main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISO_PATH=$(ls result/iso/*.iso)
          gh release delete live-iso --yes --cleanup-tag || true
          gh release create live-iso "$ISO_PATH" \
            --title "HiTech-OS — ISO live (dernier build de main)" \
            --notes "Générée automatiquement depuis le commit ${{ github.sha }}. Cette release est écrasée à chaque push sur main — ce n'est pas une version stable figée." \
            --prerelease
