name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ai-daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build ai-daemon
        working-directory: ai-daemon
        run: cargo build --verbose
      - name: Lint (clippy)
        working-directory: ai-daemon
        run: cargo clippy -- -D warnings

  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - run: nix flake check --extra-experimental-features "nix-command flakes"

  os-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Build nixosConfigurations.patient-zero (variante QEMU)
        run: nix build .#nixosConfigurations.patient-zero.config.system.build.toplevel -L --extra-experimental-features "nix-command flakes"
      - name: Taille de la closure (indicateur d'empreinte)
        run: du -sh result

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install platformio
      - name: Secrets de build (placeholders — jamais les vrais identifiants)
        working-directory: firmware/patient-zero/src
        run: cp secrets.h.example secrets.h
      - name: Build firmware ESP32
        working-directory: firmware/patient-zero
        run: pio run

  iso-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # requis pour publier/mettre à jour la Release ci-dessous
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Build de l'ISO live HiTech-OS
        run: nix build .#nixosConfigurations.iso.config.system.build.isoImage -L --extra-experimental-features "nix-command flakes"
      - name: Taille de l'ISO générée
        run: du -sh result/iso/*
      - name: Générer le checksum SHA-256
        run: |
          ISO_PATH=$(find result/iso -maxdepth 1 -type f -name '*.iso' -print -quit)
          test -n "$ISO_PATH"
          ISO_NAME=$(basename "$ISO_PATH")
          (cd "$(dirname "$ISO_PATH")" && sha256sum "$ISO_NAME" > "$ISO_NAME.sha256")
      - name: Publier l'ISO comme artefact du run (téléchargeable depuis ce run)
        uses: actions/upload-artifact@v4
        with:
          name: hitechos-live-iso
          path: |
            result/iso/*.iso
            result/iso/*.iso.sha256
          retention-days: 90   # max habituellement autorisé pour un repo public
      - name: Publier/mettre à jour la Release "live-iso"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ISO_PATH=$(find result/iso -maxdepth 1 -type f -name '*.iso' -print -quit)
          SHA_PATH="$ISO_PATH.sha256"
          test -f "$ISO_PATH"
          test -f "$SHA_PATH"
          ISO_SIZE=$(stat -c%s "$ISO_PATH")
          LIMIT=$((2 * 1000 * 1000 * 1000))  # 2 Go, limite fixe imposée par GitHub Releases
          if [ "$ISO_SIZE" -ge "$LIMIT" ]; then
            echo "::warning::ISO de $((ISO_SIZE / 1000 / 1000)) Mo — dépasse la limite de 2 Go des Releases GitHub. Récupère-la via l'onglet Artifacts de ce run à la place."
            exit 0
          fi
          if gh release view live-iso >/dev/null 2>&1; then
            gh release upload live-iso "$ISO_PATH" "$SHA_PATH" --clobber
          else
            gh release create live-iso "$ISO_PATH" "$SHA_PATH" \
              --title "HiTech-OS — ISO live (dernier build de main)" \
              --notes "Générée automatiquement depuis le commit ${{ github.sha }}. Cette release est mise à jour à chaque build réussi de main. Vérifiez le fichier .sha256 avant de flasher l’ISO." \
              --prerelease
          fi
