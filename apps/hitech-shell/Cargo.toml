[package]
name = "hitech-shell"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "HiTech-Shell — modular Wayland compositor and desktop shell for HiTech-OS"
repository = "https://github.com/HiTechTN/HiTech-OS"

[features]
default = []
smithay = []

[dependencies]
smithay = { version = "0.7.0", default-features = false, features = [
  "backend_drm",
  "backend_gbm",
  "backend_libinput",
  "backend_udev",
  "backend_session_libseat",
  "desktop",
  "renderer_gl",
  "wayland_frontend",
] }
smithay-drm-extras = { version = "0.1.0", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
