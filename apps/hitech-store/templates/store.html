<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>HiTech Drive // Stockage Souverain</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">H</span><div><h1>HiTech Drive</h1><small>stockage souverain · lab.hitech.tn</small></div></div>
  <div class="top-actions">
    <button id="viewToggle" class="btn ghost" title="Basculer Grille / Liste">▦ Liste</button>
    <button id="adminBtn" class="btn primary">Administration</button>
  </div>
</header>

<nav id="crumbs" class="crumbs"></nav>

<div id="uploadBar" class="uploadbar hidden">
  <select id="upFolder" title="Dossier de destination (si racine affichée)"></select>
  <input type="file" id="upFile" multiple title="Sélectionner un ou plusieurs fichiers">
  <button class="btn ok" onclick="uploadFile()">Téléverser</button>
  <button class="btn" onclick="pickFolder()" title="Téléverser un dossier complet (arborescence conservée)">📂 Dossier</button>
  <input type="file" id="upDir" webkitdirectory directory class="hidden">
  <button class="btn" onclick="makeFolder()" title="Créer un nouveau dossier ici">📁 Nouveau dossier</button>
  <span id="upStatus" class="muted"></span>
</div>

<main id="explorer" class="grid"></main>
<div id="empty" class="empty hidden">Dossier vide.</div>

<!-- Preview modal -->
<div id="previewModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><span id="pvTitle"></span><button class="btn ghost" onclick="closePreview()">✕</button></div>
    <div id="pvBody" class="modal-body"></div>
  </div>
</div>

<!-- Admin OTP modal -->
<div id="authModal" class="modal hidden">
  <div class="modal-box small">
    <div class="modal-head"><span>Authentification Admin</span><button class="btn ghost" onclick="closeAuth()">✕</button></div>
    <div class="modal-body">
      <p class="muted">Code PIN sécurisé envoyé par email.</p>
      <button id="otpBtn" class="btn primary wide" onclick="quickOtp()">Renvoyer le code</button>
      <div class="pinrow">
        <input id="pinInput" maxlength="6" pattern="[0-9]{6}" inputmode="numeric" placeholder="──────" autocomplete="one-time-code">
        <button class="btn ok" onclick="verifyPin()">Déverrouiller</button>
      </div>
      <div id="githubLogin" class="hidden">
        <p class="muted">ou</p>
        <a class="btn primary wide" href="/auth/github">Se connecter avec GitHub</a>
      </div>
      <p id="authMsg" class="muted"></p>
    </div>
  </div>
</div>

<!-- Share modal -->
<div id="shareModal" class="modal hidden">
  <div class="modal-box small">
    <div class="modal-head"><span>🔗 Partager</span><button class="btn ghost" onclick="closeShare()">✕</button></div>
    <div class="modal-body">
      <p class="muted" id="sharePath"></p>
      <label class="muted">Durée de validité :</label>
      <select id="shareTtl">
        <option value="10">10 minutes</option>
        <option value="60" selected>1 heure</option>
        <option value="1440">24 heures</option>
        <option value="10080">7 jours</option>
      </select>
      <label class="muted">Utilisations max (téléchargements) :</label>
      <select id="shareUses">
        <option value="0" selected>Illimitées</option>
        <option value="1">1 seule — usage unique</option>
        <option value="5">5</option>
        <option value="20">20</option>
      </select>
      <button class="btn primary wide" onclick="createShare()">Créer le lien public</button>
      <div id="shareOut"></div>
      <h4>Liens actifs</h4>
      <div id="shareList" class="muted">Chargement…</div>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
